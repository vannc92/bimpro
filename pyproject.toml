[project]
name = "bimpro"
version = "0.1.0"
description = "Biên soạn Kế hoạch thực hiện BIM (BEP) và phụ lục theo giai đoạn dự án"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "pyyaml>=6",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "pypdf>=4",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
bimpro = "bimpro.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bimpro = ["library/**/*", "web/templates/*", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
