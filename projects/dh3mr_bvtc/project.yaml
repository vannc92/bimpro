  report_outline:
  - 1. PHẦN BÁO CÁO
  - 1.1 Thông tin chung về dự án
  - 1.2 Mục tiêu và các ứng dụng BIM của dự án
  - 1.3 Phạm vi công việc thực hiện
  - 1.4 Tiêu chuẩn áp dụng
  - 1.5 Môi trường dữ liệu chung
  - 1.6 Khối lượng công việc đã thực hiện; bảng khối lượng bóc tách từ mô hình
  - 1.7 Nhân sự tham gia thực hiện
  - 1.8 Kế hoạch và tiến độ thực hiện BIM
  - 1.9 Kết quả kiểm tra xung đột và các vấn đề phát sinh (nếu có)
  - 2. PHẦN ĐÁNH GIÁ
  - 2.1 Đánh giá chung về khối lượng công việc
  - 2.2 Đánh giá về chất lượng triển khai các ứng dụng BIM
  - 2.3 Đánh giá về tiến độ thực hiện
  - '2.4 Các vấn đề khác: điều kiện thuận lợi, khó khăn, các vấn đề tồn tại'
  - 3. PHẦN KẾT LUẬN VÀ KIẾN NGHỊ
  - 3.1 Kết luận về quá trình ứng dụng BIM tại dự án
  - 3.2 Kiến nghị
coordination:
  process_image: ''
  checks:
  - name: Kiểm tra trực quan mô hình bộ môn
    description: Quan sát mô hình, đối chiếu với bản vẽ và số liệu thiết kế của bộ môn
    responsible: Các bộ môn
    software: Revit
    frequency: Thường xuyên
  - name: Kiểm tra tuân thủ quy định của BEP
    description: Quy tắc đặt tên, hệ tọa độ, mức độ LOD, tham số bắt buộc
    responsible: Trưởng nhóm BIM bộ môn
    software: Revit, Navisworks
    frequency: Trước mỗi lần chia sẻ
  - name: Kiểm tra xung đột
    description: Chạy kiểm tra theo ma trận xung đột trên mô hình tổng hợp gồm mô hình bộ môn và mô hình hiện trạng
    responsible: Điều phối BIM
    software: Navisworks Manage
    frequency: Hằng tuần trong đợt
  - name: Kiểm tra IFC xuất ra
    description: Đủ đối tượng, đúng lớp IFC, đủ thuộc tính
    responsible: Điều phối BIM
    software: Công cụ kiểm tra IFC
    frequency: Trước mỗi lần phát hành
  - name: Kiểm tra độc lập
    description: Kiểm tra xung đột trên mô hình đã chia sẻ, lập báo cáo xung đột và sai sót thiết kế
    responsible: Tư vấn giám sát
    software: Theo lựa chọn của Tư vấn giám sát
    frequency: Mỗi đợt TKBVTC
  - name: Phối hợp và ghi nhận vấn đề trên CDE
    description: Sử dụng chức năng quản lý vấn đề, RFI, RFC để trao đổi và theo dõi xử lý
    responsible: Các bên tham gia
    software: CDE
    frequency: Thường xuyên
  clashes:
  - pair: Cọc mới – cọc, đài móng kho than và móng tường chắn gió hiện hữu
