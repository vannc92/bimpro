naming:
  syntax: <Mã dự án>-<Đơn vị khởi tạo>-<Kiểu tệp tin>-<Bộ môn>-<Số thứ tự>
  example: 'Quy tắc này theo mục 3.3.3 Chương V E-HSMT; mã dự án là DH3MR.KT. Ví dụ: DH3MR.KT-PECC2-DR-STR-0001
    là bản vẽ kết cấu số 0001 do PECC2 lập. Tệp mô hình không bắt buộc có số thứ tự. Để phân biệt nhiều mô hình
    cùng bộ môn, Nhà thầu bổ sung hậu tố mô tả sau trường bộ môn, phân cách bằng dấu gạch dưới, ví dụ DH3MR.KT-PECC2-M3-STR_GIAN.rvt
    «cần Chủ đầu tư chấp thuận».'
  regex: ^DH3MR\.KT-[A-Z0-9]{2,6}-[A-ZĐ0-9]{2}-(ARC|STR|AST|MEC|ELC|MEP|ALL)(_[A-Z0-9]+)?(-\d{4})?$
  fields:
  - name: Mã dự án
    length: '8'
    required: Có
    example: DH3MR.KT
    note: Cố định theo E-HSMT
  - name: Đơn vị khởi tạo
    length: 2–6
    required: Có
    example: PECC2
    note: Theo bảng mã Đơn vị khởi tạo
  - name: Kiểu tệp tin
    length: '2'
    required: Có
    example: M3
    note: Theo bảng mã Kiểu tệp tin của E-HSMT
  - name: Bộ môn
    length: '3'
    required: Có
    example: STR
    note: Theo bảng mã Bộ môn của E-HSMT; có thể kèm hậu tố _<MÔ TẢ> cho mô hình
  - name: Số thứ tự
    length: '4'
    required: Không bắt buộc với mô hình
    example: '0001'
    note: Bốn chữ số, không dùng lại số đã cấp
  codes:
  - table: Đơn vị khởi tạo
    code: PECC2
    meaning: Công ty Cổ phần Tư vấn Xây dựng Điện 2
    note: ''
