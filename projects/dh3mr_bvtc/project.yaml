  - area: Hạng mục hiện hữu
    discipline: Kết cấu, Xây dựng (STR, AST)
    scope: Móng và cọc kho than, tường chắn than, móng và tường chắn gió, mái vòm hiện hữu, mương thoát nước mưa,
