    tolerance: «…»
    responsible: Điều phối BIM, nhóm Kết cấu
    frequency: Mỗi lần cập nhật mô hình đợt 1
  - pair: Đài, giằng móng mới – mương thoát nước, tường chắn than hiện hữu; phạm vi tháo dỡ – hoàn trả
