    tolerance: «…»
    responsible: Điều phối BIM, nhóm Kết cấu – Xây dựng
    frequency: Hằng tuần trong đợt
  - pair: Giàn mới – mái vòm hiện hữu (hình học, cao độ, khe nhiệt, che chắn, thoát nước tại vị trí nối tiếp)
    kind: Cứng; khoảng hở
    tolerance: «…»
    responsible: Điều phối BIM, nhóm Kết cấu – Kiến trúc
    frequency: Hằng tuần trong đợt giàn mái
  - pair: Giàn, khung – khối bao hoạt động máy đánh phá đống và băng tải
