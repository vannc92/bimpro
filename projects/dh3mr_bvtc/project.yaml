delivery:
  it: Nhóm BIM của Nhà thầu sử dụng máy trạm cấu hình đồ họa phù hợp Revit 2024 và Navisworks, kết nối Internet
    tốc độ cao tại văn phòng PECC2 và văn phòng công trường; thiết bị di động (máy tính bảng) cho BIM hiện trường.
    Nhà thầu bố trí phần cứng, phần mềm và kết nối để làm việc với CDE của dự án, hệ thống quản lý hồ sơ trực tuyến
    và IMIS 2.0 của Chủ đầu tư theo mục III.4 Chương V E-HSMT.
  formats:
  - 'Mô hình BIM – định dạng trao đổi: *.ifc, *.nwc, *.nwd'
  - 'Mô hình tổng hợp từng đợt TKBVTC và mô hình hoàn công: *.ifc, *.nwd'
  - 'Định dạng gốc: *.rvt (Revit 2024) đối với các mô hình kết cấu, kiến trúc, cơ, điện; định dạng gốc được lưu
    trữ trên CDE và cung cấp cho Chủ đầu tư'
  deliverables:
  - name: Kế hoạch thực hiện BIM (BEP) và các phụ lục, MIDP
    format: '*.docx, *.pdf'
    milestone: T0 + 14 ngày
  - name: Mô hình hiện trạng và biên bản tiếp nhận dữ liệu đầu vào
    format: '*.rvt, *.ifc, *.nwd'
    milestone: T0 + 07 ngày
  - name: Mô hình TKBVTC theo đợt, bản vẽ trích xuất, báo cáo kiểm tra xung đột (Tập 6 – Thiết kế BIM)
    format: '*.rvt, *.ifc, *.nwd, *.pdf'
    milestone: 'Cùng hồ sơ TKBVTC mỗi đợt (đợt 1: T0 + 30 ngày)'
  - name: Mô phỏng tiến độ 4D, mô phỏng biện pháp lắp dựng giàn
    format: '*.nwd, *.mp4'
    milestone: Trước khi lắp dựng giàn; cập nhật theo tiến độ
  - name: Báo cáo kết quả thực hiện BIM phục vụ nghiệm thu khối lượng
    format: '*.pdf, *.xlsx'
    milestone: Theo từng đợt nghiệm thu thi công
  - name: Mô hình hoàn công, bản vẽ hoàn công
    format: '*.rvt, *.ifc, *.pdf'
    milestone: Trước nghiệm thu hoàn thành (31/3/2027)
  - name: Báo cáo lưu trữ dữ liệu BIM phục vụ chuyển giao cho đơn vị vận hành
    format: '*.pdf, *.xlsx, *.ifc'
    milestone: Cùng hồ sơ hoàn thành công trình
  review_products: 'Sản phẩm BIM trình kèm hồ sơ TKBVTC mỗi đợt (Tập 6 – Thiết kế BIM) gồm: các mô hình bộ môn của
    đợt (*.rvt, *.ifc); mô hình tổng hợp (*.nwd) và báo cáo kiểm tra xung đột, tình trạng xử lý; bảng khối lượng
    bóc tách từ mô hình; Báo cáo mô hình thông tin công trình BIM của đợt. Thời gian thực hiện sản phẩm BIM không
    bao gồm thời gian xem xét, thẩm tra, phê duyệt của Chủ đầu tư và Tư vấn giám sát. Nhiệm vụ kỹ thuật quy định
    hồ sơ TKBVTC đợt 1 – ấn bản 1 trong 15 ngày kể từ ngày hợp đồng có hiệu lực, trong khi mốc T1 tại Chương V E-HSMT
    là T0 + 30 ngày cho cả lập, thẩm tra, thẩm định và phê duyệt; kế hoạch này lấy theo mốc T1 «cần Chủ đầu tư xác
    nhận».'
