cde:
  name: CDE của dự án
  provider: Tư vấn giám sát (gói thầu 02TV-DH3MR)
  intro: Theo Quyết định phê duyệt kế hoạch lựa chọn nhà thầu và mục III.3 Chương V E-HSMT, hệ thống CDE của dự
    án do Tư vấn giám sát (gói thầu 02TV-DH3MR) cung cấp và duy trì từ lúc khởi công đến lúc bàn giao; Nhà thầu
    ứng dụng, cập nhật mô hình BIM thi công, hoàn công và khai thác, lưu trữ dữ liệu trên hệ thống CDE đó. Trong
    thời gian CDE của dự án chưa sẵn sàng, Nhà thầu sử dụng nền tảng vCDE do PECC2 phát triển và vận hành làm môi
    trường làm việc tạm thời, tổ chức theo cùng cấu trúc thư mục và trạng thái, và chuyển toàn bộ dữ liệu sang CDE
    của dự án khi được bàn giao «cần thống nhất với Chủ đầu tư, Tư vấn giám sát tại cuộc họp khởi động». Hồ sơ ở
    trạng thái Phát hành được trình nộp chính thức qua hệ thống quản lý hồ sơ trực tuyến của Chủ đầu tư (file gốc
    và file PDF); nhật ký thi công và biên bản nghiệm thu điện tử thực hiện trên IMIS 2.0 theo mục III.4 Chương
    V E-HSMT.
  size_limit: ''
  modules:
  - name: Quản lý tài liệu
    purpose: Lưu trữ, kiểm soát phiên bản mô hình, bản vẽ TKBVTC, hồ sơ hoàn công theo cấu trúc thư mục và 4 vùng
      trạng thái CDE
  - name: Xem xét (Review)
    purpose: Rà soát nội bộ Nhà thầu (bộ môn – Điều phối BIM – Quản lý BIM) trước khi chia sẻ cho Tư vấn giám sát
  - name: Trình duyệt (Submittal)
    purpose: Trình mô hình và hồ sơ TKBVTC từng đợt để Tư vấn giám sát kiểm tra, Chủ đầu tư xem xét; theo dõi kết
      quả phê duyệt
  - name: Phân phối tài liệu (Transmittal)
    purpose: Phát hành chính thức mô hình, hồ sơ đã phê duyệt tới Chủ đầu tư, Tư vấn giám sát, các thành viên liên
      danh và hiện trường
  - name: Mô hình BIM
    purpose: Xem mô hình IFC, mô hình tổng hợp trực tiếp trên trình duyệt phục vụ họp điều phối và tra cứu tại hiện
      trường
  - name: Vấn đề và cộng tác
    purpose: Quản lý xung đột, RFI, RFC, ý kiến của Tư vấn giám sát và vấn đề hiện trường gắn vị trí 3D
  - name: Bảng điều khiển
    purpose: Theo dõi tiến độ chuyển giao theo MIDP/TIDP, tình trạng xử lý vấn đề và trạng thái phê duyệt từng đợt
      TKBVTC
  status_codes:
  - code: WIP
    name: Đang thực hiện
    zone: WIP
    meaning: Thông tin đang được nhóm tác giả tạo lập, chưa chia sẻ
  - code: S1
    name: Phối hợp
    zone: SHARED
    meaning: Chia sẻ để các bộ môn phối hợp
  - code: S2
    name: Thông tin tham khảo
    zone: SHARED
    meaning: Chia sẻ để tham khảo
  - code: S3
    name: Xem xét, góp ý
    zone: SHARED
    meaning: Chia sẻ để xem xét và cho ý kiến
  - code: S4
    name: Trình phê duyệt
    zone: SHARED
    meaning: Trình Chủ đầu tư xem xét chấp thuận
  - code: A1
    name: Chấp thuận
    zone: PUBLISHED
    meaning: Được chấp thuận phát hành
  - code: B1
    name: Chấp thuận có ý kiến
    zone: PUBLISHED
    meaning: Chấp thuận kèm ý kiến cần cập nhật ở phiên bản sau
  - code: CR
