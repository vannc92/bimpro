    code: PECC3
    meaning: Công ty Cổ phần Tư vấn Xây dựng Điện 3
    note: Dữ liệu đầu vào giai đoạn BCNCKT/TKCS
  - table: Đơn vị khởi tạo
    code: «…»
    meaning: Các thành viên liên danh, nhà thầu phụ, Tư vấn giám sát
    note: Bổ sung khi lập danh sách các bên
  - table: Kiểu tệp tin
