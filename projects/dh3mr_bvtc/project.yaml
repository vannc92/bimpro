overrides:
  bep:
    nghiem-thu:
      enabled: true
      body: |-
        - Quản lý BIM tổng hợp hồ sơ nghiệm thu nội bộ của từng đợt gồm: mô hình thành phần, mô hình tổng hợp, kết quả kiểm tra ba lớp, báo cáo xung đột và báo cáo tình trạng vấn đề trích xuất từ CDE;
        - Sản phẩm sau khi được Giám đốc dự án của {{ A }} chấp thuận được Quản lý BIM chuyển sang trạng thái Shared để Tư vấn giám sát kiểm tra độc lập;
        - Sau khi các ý kiến của Tư vấn giám sát đã được xử lý, sản phẩm được phát hành ở trạng thái Published và trình nộp qua hệ thống quản lý hồ sơ trực tuyến của Chủ đầu tư;
        - Chủ đầu tư nghiệm thu sản phẩm BIM cùng hồ sơ TKBVTC mỗi đợt và hồ sơ hoàn công theo BEP đã được chấp thuận; kết quả được ghi nhận bằng biên bản và lưu trên CDE.
    bao-mat:
      enabled: true
      body: |-
        Toàn bộ quy trình quản lý, khai thác, chia sẻ, lưu trữ dữ liệu BIM tuân thủ quy định của pháp luật về an ninh mạng và an toàn, bảo mật thông tin, cụ thể là Luật An ninh mạng số 116/2025/QH15 và khoản 6 Điều 8 Nghị định số 217/2026/NĐ-CP. Trên {{ CDE }}, {{ A }} tuân thủ quy định vận hành của đơn vị cung cấp; trong phạm vi của mình, {{ A }} áp dụng các biện pháp sau:

        - Mỗi thành viên dùng tài khoản định danh cá nhân; không sử dụng tài khoản dùng chung;
        - Quyền truy cập được đề nghị cấp theo vai trò trong ma trận phân quyền tại {{ pl('pl_cde') }} và thu hồi ngay khi nhân sự rời dự án;
        - Không chia sẻ dữ liệu dự án ra ngoài các bên tham gia khi chưa được Chủ đầu tư chấp thuận;
        - Dữ liệu trên môi trường làm việc tạm thời của {{ A }} (nếu có) được lưu trữ tại hạ tầng đặt trong lãnh thổ Việt Nam, có nhật ký hoạt động và sao lưu định kỳ.
