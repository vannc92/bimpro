schedule:
  milestones:
  - task: T0 – Hợp đồng có hiệu lực
    time: «…»
  - task: Hoàn thiện, trình Kế hoạch thực hiện BIM (BEP)
    time: T0 + 14 ngày
  - task: T1 – Lập, thẩm tra, thẩm định và phê duyệt hồ sơ TKBVTC đợt 1 (các đợt sau, mỗi đợt 10 ngày)
    time: T0 + 30 ngày
  - task: T2 – Thi công phần cọc, móng
    time: T1 + 90 ngày
  - task: T3 – Gia công chế tạo hệ khung giàn, tôn mái, phụ kiện, vận chuyển và lắp đặt hoàn chỉnh
    time: T1 + 130 ngày
  - task: T4 – Hoàn thiện công trình
    time: T3 + 5 ngày
  - task: T5 – Nghiệm thu hoàn thành
    time: 31/3/2027
bim:
  lod: '350'
  features:
    drawings: true
    clash: true
    qto: true
    sim4d: true
    existing: true
    asbuilt: true
    supervisor: true
  objectives:
  - Thiết lập mô hình BIM tương ứng giai đoạn TKBVTC theo từng bộ môn trên cơ sở mô hình BCNCKT/TKCS do Chủ đầu
    tư cung cấp, phối hợp 3D và phát hiện xung đột trước khi phát hành hồ sơ TKBVTC
  - Đưa các hạng mục hiện hữu có liên quan (móng kho than, tường chắn than, tường chắn gió, mái che, mương thoát
    nước mưa, mương thoát nước nhiễm than, hạ tầng kỹ thuật) vào mô hình để phối hợp, kiểm tra với các hạng mục
    xây dựng mới
  - Mô phỏng tiến độ và biện pháp thi công (BIM 4D) ở mức phù hợp với đặc thù thi công trong kho than đang vận hành
  - Bóc tách khối lượng từ mô hình để hỗ trợ tính toán khối lượng xây lắp, vật tư theo từng đợt thi công
  - Hoàn thiện mô hình hoàn công và dữ liệu hoàn công bàn giao cho Công ty Nhiệt điện Duyên Hải phục vụ quản lý
    vận hành, bảo trì
  uses:
  - name: Lập Kế hoạch thực hiện BIM (BEP)
    required: true
    description: Nhà thầu hoàn thiện BEP trong 14 ngày kể từ ngày Hợp đồng có hiệu lực, thống nhất giải pháp CDE,
      quy tắc đặt tên, ma trận LOD, ma trận kiểm tra xung đột, MIDP/TIDP và ma trận trách nhiệm; BEP được trình
      Chủ đầu tư chấp thuận trước khi mô hình hóa và được cập nhật khi có thay đổi phạm vi hoặc tiến độ.
  - name: Mô hình hiện trạng
    required: true
    description: Mô hình BCNCKT/TKCS do Chủ đầu tư cung cấp được kiểm tra về hệ tọa độ, cao độ, đơn vị và đối chiếu
      với các bản vẽ hoàn công kho than hiện hữu (móng kho than, móng tường chắn gió, đầu cọc). Các hạng mục hiện
      hữu có liên quan được bổ sung ở mức LOD 200 để phục vụ kiểm tra và thiết kế giao diện.
  - name: Mô hình TKBVTC
    required: true
    description: 'Mô hình kết cấu, xây dựng, điện và PCCC được lập theo từng đợt TKBVTC ở mức LOD 350 theo mục 3.3.4
      Chương V E-HSMT: ngoài hình học chính xác về số lượng, kích thước, hình dạng, vị trí và hướng, mô hình thể
      hiện giao diện, liên kết với các cấu kiện liên quan. Mô hình được sử dụng để trích xuất một số loại bản vẽ
      và bảng thống kê khối lượng, và để đánh giá giải pháp thiết kế: hình học mái vòm và vị trí nối tiếp với mái
      hiện hữu, bố trí tấm lấy sáng, tuyến thoát nước mái, vị trí đèn và tủ điện, bố trí hệ thống chữa cháy bổ sung.'
  - name: Phối hợp 3D, kiểm tra xung đột
    required: true
    description: Các mô hình bộ môn và mô hình hiện trạng được tích hợp thành mô hình tổng hợp theo chu kỳ trong
      mỗi đợt TKBVTC. Các xung đột được nhận diện, phân loại và giao trách nhiệm xử lý thông qua các phiên họp điều
      phối. Hồ sơ TKBVTC của từng đợt chỉ được phát hành khi các xung đột đã được giải quyết.
  - name: Bóc tách khối lượng từ mô hình
    required: true
    description: Phạm vi bóc tách tập trung vào các cấu kiện chính như cọc, bê tông, cốt thép, kết cấu thép, tôn
      mái, phụ kiện và thiết bị điện – chiếu sáng. Khối lượng được tổng hợp theo từng đợt thi công để phục vụ báo
      cáo kết quả BIM. Việc bóc tách này mang tính hỗ trợ kiểm tra, đối chiếu khối lượng và không sử dụng cho mục
      đích nghiệm thu, thanh toán của hợp đồng EPC.
  - name: Mô phỏng tiến độ thi công (BIM 4D)
    required: true
    description: Mô hình BIM được chia theo các phân đoạn thi công và liên kết với tiến độ tổng thể đã được phê
      duyệt để mô phỏng trình tự thi công, bao gồm thi công cọc – móng, lắp dựng kết cấu khung – giàn mái, vùng
      hoạt động của cẩu và phạm vi che phủ đống than. Mô phỏng 4D là công cụ hỗ trợ xem xét, đánh giá kế hoạch thi
      công; việc cập nhật mô phỏng không mang tính bắt buộc xuyên suốt quá trình thi công.
  - name: Trao đổi thông tin trên CDE
    required: true
    description: Toàn bộ thông tin BIM của gói thầu được quản lý trên CDE theo các trạng thái Đang thực hiện – Chia
      sẻ – Phát hành – Lưu trữ. Các vấn đề thiết kế và thi công, RFI, RFC được trao đổi giữa các bên thông qua CDE;
      Nhà thầu sử dụng CDE để truy cập mô hình tại công trường và lưu trữ thông tin hiện trường (báo cáo, hình ảnh,
      vấn đề).
  - name: Mô hình hoàn công
    required: true
    description: Mô hình thiết kế được cập nhật theo thực tế thi công và bản vẽ hoàn công để hình thành mô hình
      hoàn công bàn giao cho Chủ đầu tư.
  - name: Bàn giao dữ liệu cho đơn vị vận hành
    required: true
    description: Mô hình hoàn công, tài liệu hoàn công và Báo cáo lưu trữ dữ liệu BIM được bàn giao cho Chủ đầu
      tư và Công ty Nhiệt điện Duyên Hải để sử dụng trong giai đoạn vận hành.
  limits:
  - Mức độ phát triển thông tin của các hạng mục xây dựng mới là LOD 350; riêng bọc chống cháy và nối đất ở mức
    LOD 300. Các hạng mục hiện hữu, khối bao thiết bị vận hành và mặt bằng tổ chức thi công ở mức LOD 200–300, đủ
    cho kiểm tra xung đột và thiết kế giao diện
  - Bản vẽ TKBVTC được lập theo quy trình thiết kế của Nhà thầu; chỉ một số loại bản vẽ và bảng thống kê được trích
    xuất trực tiếp từ mô hình, danh mục cụ thể nêu tại MIDP
  - Khối lượng bóc tách từ mô hình dùng để hỗ trợ kiểm tra, đối chiếu; không dùng cho nghiệm thu, thanh toán của
    hợp đồng EPC. Dự toán chi phí (BIM 5D) nêu tại Nhiệm vụ kỹ thuật được đáp ứng ở mức cung cấp khối lượng từ mô
    hình làm đầu vào cho công tác dự toán «cần Chủ đầu tư xác nhận»
  - Mô phỏng 4D thực hiện cho các công tác chính (cọc – móng, lắp dựng khung – giàn mái, vùng hoạt động của cẩu);
    không cập nhật bắt buộc xuyên suốt quá trình thi công
  - Không mô hình hóa thiết bị công nghệ của kho than (máy đánh phá đống, băng tải) ngoài khối bao phạm vi hoạt
    động
  scope_items:
  - 'Hạng mục hiện hữu có liên quan: móng và cọc kho than, tường chắn than, móng và tường chắn gió, mái vòm hiện
    hữu, mương thoát nước mưa, mương thoát nước nhiễm than, hạ tầng kỹ thuật'
  - Cọc, móng, đài, giằng kho than mở rộng
  - Hệ khung cột – dầm BTCT đỡ mái
  - Giàn không gian mái vòm (thanh, nút cầu, gối), tôn mái, tôn lấy sáng, nẹp diềm, bọc chống cháy
  - Tường chắn than, mương thoát nước nhiễm than khu vực mở rộng; máng và hệ thống thoát nước mái
  - Chiếu sáng, chiếu sáng sự cố, tủ điện, tuyến cáp, nối đất – chống quá điện áp
  - Hệ thống chữa cháy bổ sung
  - Mặt bằng tổ chức thi công, bãi tập kết, vị trí cẩu, phạm vi che chắn bảo vệ băng tải (phục vụ 4D)
