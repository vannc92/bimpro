  note: 'Dự án Mở rộng mái che kho than NMNĐ Duyên Hải 3 mở rộng là công trình năng lượng cấp I, đã được áp dụng
    BIM từ giai đoạn lập Báo cáo nghiên cứu khả thi theo Điều 8 Nghị định số 217/2026/NĐ-CP. Ở giai đoạn thiết kế
    xây dựng triển khai sau thiết kế cơ sở, hồ sơ TKBVTC phải bao gồm BIM theo Điều 23 Nghị định số 217/2026/NĐ-CP
    và mục 6 Phụ lục 1 Nhiệm vụ kỹ thuật được phê duyệt tại Quyết định số 1689/QĐ-EVNPMB3 (biên chế thành Tập 6
    – Thiết kế BIM); dữ liệu BIM được nộp ở định dạng mở IFC theo khoản 3 Điều 8 của Nghị định. Kế hoạch thực hiện
    BIM này được lập theo khoản 1 mục 3.1.2 Chương V E-HSMT và trình Chủ đầu tư chấp thuận trước khi mô hình hóa.
    Khi có khác biệt, thứ tự ưu tiên áp dụng là: Hợp đồng, E-HSMT và Nhiệm vụ kỹ thuật, Kế hoạch thực hiện BIM này,
    quy trình nội bộ của Nhà thầu.'
