  - {level1: '03_PUBLISHED', level2: '03_BaoCao', content: 'Báo cáo BIM đã phát hành', suit: 'A1/B1'}
  - {level1: '04_ARCHIVED', level2: '01_MocChuyenGiao', content: 'Gói dữ liệu theo từng mốc chuyển giao', suit: 'AR'}
