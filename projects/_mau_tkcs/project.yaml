cde:
  name: vCDE
  provider: PECC2
  intro: Môi trường dữ liệu chung áp dụng cho dự án là vCDE – nền tảng quản lý dữ liệu công trình cho toàn bộ vòng đời dự án do PECC2 phát triển và vận hành, được tổ chức theo ISO 19650 và TCVN 14177. Theo khoản 2 Điều 8 Nghị định số 217/2026/NĐ-CP, phạm vi, nội dung áp dụng BIM và yêu cầu thông tin trao đổi do các bên thỏa thuận trong hợp đồng; nền tảng CDE nêu trên được Tư vấn đề xuất và sẽ được áp dụng chính thức sau khi có ý kiến chấp thuận của Chủ đầu tư.
  size_limit: 500 MB
  modules:
  - {name: 'Quản lý tài liệu', purpose: 'Lưu trữ, kiểm soát phiên bản tự động, gán trạng thái CDE theo thư mục, kiểm tra tiêu chuẩn đặt tên khi tải lên'}
  - {name: 'Xem xét (Review)', purpose: 'Rà soát nội bộ Tư vấn trước khi chia sẻ; áp dụng mã phản hồi theo ISO 19650'}
  - {name: 'Trình duyệt (Submittal)', purpose: 'Trình hồ sơ và mô hình lên Chủ đầu tư, đơn vị thẩm tra; theo dõi vòng trình duyệt'}
  - {name: 'Phân phối tài liệu (Transmittal)', purpose: 'Phát hành chính thức tài liệu tới các bên, xác nhận đã nhận, theo dõi người nhận'}
  - {name: 'Mô hình BIM', purpose: 'Tải lên IFC, xem mô hình 3D trực tiếp trên trình duyệt, so sánh phiên bản, ghi chú trên mô hình'}
  - {name: 'Vấn đề và cộng tác', purpose: 'Quản lý nhật ký vấn đề (Issues) gắn vị trí 3D, nhật ký kiểm soát tài liệu (DCL), biểu đồ đường cong S theo dõi tiến độ nộp hồ sơ'}
  - {name: 'Bảng điều khiển', purpose: 'Theo dõi tiến trình quy trình, công việc của từng cá nhân, tổng quan dự án và nhật ký hoạt động phục vụ kiểm toán'}
  status_codes:
  - {code: 'WIP', name: 'Đang thực hiện', zone: 'WIP', meaning: 'Thông tin đang được nhóm tác giả tạo lập, chưa chia sẻ'}
  - {code: 'S1', name: 'Phối hợp', zone: 'SHARED', meaning: 'Chia sẻ để các bộ môn phối hợp'}
  - {code: 'S2', name: 'Thông tin tham khảo', zone: 'SHARED', meaning: 'Chia sẻ để tham khảo'}
  - {code: 'S3', name: 'Xem xét, góp ý', zone: 'SHARED', meaning: 'Chia sẻ để xem xét và cho ý kiến'}
  - {code: 'S4', name: 'Trình phê duyệt', zone: 'SHARED', meaning: 'Trình Chủ đầu tư xem xét chấp thuận'}
  - {code: 'A1', name: 'Chấp thuận', zone: 'PUBLISHED', meaning: 'Được chấp thuận phát hành'}
  - {code: 'B1', name: 'Chấp thuận có ý kiến', zone: 'PUBLISHED', meaning: 'Chấp thuận kèm ý kiến cần cập nhật ở phiên bản sau'}
  - {code: 'CR', name: 'Hoàn công', zone: 'PUBLISHED', meaning: 'Thông tin hoàn công'}
  - {code: 'AR', name: 'Lưu trữ', zone: 'ARCHIVED', meaning: 'Phiên bản đã thay thế hoặc lưu trữ theo mốc'}
  folders:
  - {level1: '01_WIP', level2: '00_QuanLyBIM', content: 'Hồ sơ quản lý BIM đang soạn thảo (BEP, MIDP, báo cáo)', suit: 'WIP'}
  - {level1: '01_WIP', level2: '01_CV_XayDung', content: 'Mô hình đang dựng của bộ môn Xây dựng', suit: 'WIP'}
  - {level1: '01_WIP', level2: '02_ME_CongNghe', content: 'Mô hình đang dựng của bộ môn Công nghệ', suit: 'WIP'}
