bim:
  lod: '200'
  objectives:
  - Mô hình hóa các hạng mục công trình xây dựng chính để thể hiện trực quan, giúp các thành viên tham gia dự án hiểu rõ khi thảo luận, phân công nhiệm vụ hoặc lựa chọn giải pháp thiết kế hiệu quả; các bên liên quan hiểu rõ giải pháp thiết kế để ra quyết định phù hợp
  - Xây dựng và sử dụng môi trường dữ liệu chung (CDE) để tăng hiệu quả lưu trữ và chia sẻ thông tin bằng định dạng kỹ thuật số, thuận lợi trong phối hợp, tiết kiệm thời gian chuẩn bị tài liệu và trao đổi thông tin dự án
  - Hỗ trợ rà soát tổng mặt bằng, kiểm tra sự phù hợp về bố trí không gian và giao diện giữa các hạng mục, qua đó giảm việc thay đổi, điều chỉnh thiết kế ở các giai đoạn sau
  - Tạo nguồn dữ liệu nền cho việc áp dụng BIM ở các giai đoạn thiết kế kỹ thuật, thiết kế bản vẽ thi công, thi công và quản lý vận hành sau này của dự án
  uses:
  - name: Xây dựng mô hình BIM
    required: true
    description: 'Xây dựng mô hình BIM cho các hạng mục kiến trúc, kết cấu, công nghệ, điện và hạ tầng kỹ thuật thuộc danh mục áp dụng BIM. Mô hình BIM bảo đảm thống nhất, đồng bộ với hồ sơ và bản vẽ thiết kế cơ sở; thể hiện được vị trí, kích thước chủ yếu và hình dạng không gian ba chiều của các kết cấu, thiết bị chính của công trình. Ở giai đoạn thiết kế cơ sở, đối tượng mô hình ở mức độ LOD 200: "các thành phần mô hình được thể hiện bằng đồ họa trong mô hình với các thể hiện tương đối về số lượng, kích thước, hình dạng tương đối và vị trí gần đúng; các thông tin phi hình học cũng có thể đưa vào các thành phần mô hình với LOD 200" theo Quyết định số 348/QĐ-BXD ngày 02/4/2021.'
  - name: Đánh giá thiết kế
    required: true
    description: Sử dụng phần mềm chuyên dụng để quan sát, quản lý và kiểm tra mô hình BIM; thực hiện đánh giá thiết kế trong nội bộ Tư vấn và phối hợp cùng Chủ đầu tư. Các tính năng bình luận (Comment) và đánh dấu lỗi (Markup) được sử dụng trực tiếp trên mô hình trong môi trường dữ liệu chung.
  - name: Phối hợp 3D
    required: true
    description: Sử dụng ứng dụng phối hợp đa bộ môn trên mô hình ba chiều làm phương thức phối hợp thiết kế và báo cáo kết quả phối hợp cho Chủ đầu tư. Mô hình các bộ môn được liên kết thành mô hình tổng hợp để rà soát tổng mặt bằng, kiểm tra sự phù hợp về bố trí không gian và giao diện giữa các hạng mục.
  - name: Trao đổi thông tin qua môi trường dữ liệu chung (CDE)
    required: true
    description: Việc trao đổi thông tin của dự án được thực hiện đồng bộ và thống nhất trên môi trường dữ liệu chung. Các chức năng bình luận, đánh dấu lỗi, quản lý vấn đề (Issues), cũng như việc trao đổi và xử lý các vấn đề giữa các bên phải được thực hiện qua CDE, phù hợp với vai trò và chức năng của mỗi bên. Việc lưu trữ tài liệu, bản vẽ và mô hình được thực hiện trên CDE nhằm bảo đảm tính nhất quán, khả năng kiểm soát và truy vết thông tin.
  limits:
  - Mức độ phát triển thông tin của toàn bộ mô hình là LOD 200. Mô hình không thể hiện chi tiết nội thất, lan can, bậc thang, phụ kiện đường ống (van, co, tê), chi tiết liên kết kết cấu thép và bu-lông
  - Không triển khai bản vẽ thiết kế từ mô hình BIM ở giai đoạn này. Hồ sơ bản vẽ thiết kế cơ sở được lập và phát hành theo quy trình hiện hành của Tư vấn; mô hình BIM phục vụ trực quan hóa, phối hợp và rà soát thiết kế
  - Chưa thực hiện kiểm tra va chạm tự động (clash detection) giữa các bộ môn. Công tác phối hợp ở giai đoạn này tập trung vào kiểm tra trực quan, rà soát tổng mặt bằng và giao diện giữa các hạng mục
  - Không sử dụng mô hình để bóc tách khối lượng, lập dự toán, mô phỏng tiến độ thi công (4D) hoặc quản lý chi phí (5D)
  - Không mô hình hóa các hạng mục phụ trợ ngoài danh mục áp dụng BIM (nhà kho, nhà bảo vệ, nhà để xe, hàng rào, cảnh quan chi tiết)
  scope_items: []
