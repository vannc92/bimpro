delivery:
  it: Tư vấn cung cấp và vận hành nền tảng môi trường dữ liệu chung vCDE cho dự án, bao gồm cấp tài khoản định danh cho các bên tham gia, thiết lập cấu trúc thư mục, phân quyền, quy trình phê duyệt và hướng dẫn sử dụng. Tư vấn bố trí máy trạm đồ họa đáp ứng yêu cầu chạy các phần mềm Revit, Navisworks và các công cụ liên quan cho nhóm thực hiện BIM.
  formats:
  - 'Mô hình thành phần – định dạng trao đổi phổ biến: *.ifc, *.nwc'
  - 'Mô hình tổng hợp giai đoạn thiết kế cơ sở: *.ifc, *.nwd'
  - 'Định dạng gốc: *.rvt đối với các mô hình bộ môn kiến trúc, kết cấu, công nghệ và điện; định dạng gốc được lưu trữ trên CDE và cung cấp cho Chủ đầu tư theo thỏa thuận tại Kế hoạch thực hiện BIM'
  deliverables:
  - {name: 'Kế hoạch thực hiện BIM (BEP) và các phụ lục', format: '*.docx, *.pdf', milestone: ''}
  - {name: 'Các mô hình thành phần của dự án', format: '*.rvt, *.ifc, *.nwc', milestone: ''}
  - {name: 'Mô hình tổng hợp', format: '*.ifc, *.nwd', milestone: ''}
  - {name: 'Báo cáo mô hình thông tin công trình BIM', format: '*.pdf', milestone: ''}
  - {name: 'Thiết lập và hướng dẫn sử dụng môi trường dữ liệu chung', format: '—', milestone: ''}
  review_products: 'Danh mục sản phẩm phục vụ quá trình thẩm định gồm: các mô hình thành phần; mô hình tổng hợp; Báo cáo mô hình thông tin công trình BIM; Kế hoạch thực hiện BIM (BEP). Dữ liệu BIM nộp cho cơ quan chuyên môn về xây dựng ở định dạng mở IFC theo khoản 3 Điều 8 Nghị định số 217/2026/NĐ-CP.'
  rounds:
  - {name: '#01 Bản dự thảo', date: ''}
  - {name: '#02 Bản hoàn thiện', date: ''}
  - {name: '#03 Bản phục vụ thẩm định', date: ''}
  midp:
  - {group: 'KẾ HOẠCH BIM', file: 'XXX_FS-PECC2-ZZ-PR-ZZ-0001', description: 'Kế hoạch thực hiện BIM (BEP)', native: 'docx', exchange: 'pdf', lead: 'PECC2', dates: ''}
  - {group: 'MÔ HÌNH BIM', file: 'XXX_FS-PECC2-ZZ-FM-ZZ-0001', description: 'Mô hình tổng hợp', native: 'nwf', exchange: 'nwd, ifc', lead: 'PECC2', dates: ''}
  tidp: []
coordination:
  checks:
  - {name: 'Kiểm tra trực quan mô hình bộ môn', description: 'Quan sát mô hình, đối chiếu với bản vẽ và số liệu thiết kế của bộ môn', responsible: 'Các bộ môn', software: 'Revit', frequency: 'Thường xuyên'}
  - {name: 'Rà soát tổng mặt bằng', description: 'Kiểm tra vị trí, ranh giới chiếm đất, khoảng cách bố trí giữa các hạng mục, cao độ san nền và hành lang tuyến ống', responsible: 'Điều phối BIM', software: 'Navisworks, vCDE', frequency: 'Theo mốc mô hình'}
  - {name: 'Kiểm tra giao diện giữa các hạng mục', description: 'Các điểm giao diện giữa hạng mục, hệ thống và với công trình bên ngoài', responsible: 'Các bộ môn, Điều phối BIM', software: 'Navisworks', frequency: 'Theo mốc mô hình'}
  - {name: 'Kiểm tra tuân thủ quy định của BEP', description: 'Quy ước đặt tên, hệ tọa độ, mức độ LOD, thông tin phi hình học', responsible: 'Trưởng nhóm BIM bộ môn', software: 'Revit, Navisworks', frequency: 'Trước mỗi lần chia sẻ'}
  - {name: 'Phối hợp và ghi nhận vấn đề trên CDE', description: 'Sử dụng Issues, Markup, Comment để trao đổi và theo dõi xử lý', responsible: 'Các bên tham gia', software: 'vCDE', frequency: 'Thường xuyên'}
  software:
  - {use: 'Mô hình kiến trúc, kết cấu, xây dựng', responsible: 'PECC2', software: 'Revit «phiên bản»', native: 'RVT', exchange: 'NWC, IFC'}
  - {use: 'Mô hình công nghệ', responsible: 'PECC2', software: 'Revit «phiên bản»', native: 'RVT', exchange: 'NWC, IFC'}
  - {use: 'Mô hình điện', responsible: 'PECC2', software: 'Revit «phiên bản»', native: 'RVT', exchange: 'NWC, IFC'}
  - {use: 'Liên kết, phối hợp và kiểm tra chất lượng mô hình', responsible: 'PECC2', software: 'Navisworks «phiên bản»; vCDE', native: 'NWF/NWC', exchange: 'NWD, IFC'}
  - {use: 'Quản lý dữ liệu, trao đổi và phát hành', responsible: 'PECC2', software: 'vCDE', native: '—', exchange: 'PDF, IFC, NWD'}
  units: hệ thống đo lường quốc tế SI; đơn vị chiều dài sử dụng trong mô hình là milimét, đơn vị thể hiện trên hồ sơ theo quy định của từng bộ môn
  coord_system: các mô hình sử dụng hệ tọa độ chia sẻ (Shared Coordinates) đồng bộ với hệ tọa độ áp dụng tại công trình là hệ tọa độ quốc gia VN-2000; cao độ theo hệ cao độ quốc gia
  coord_params: múi chiếu 3°, kinh tuyến trục «…»; tọa độ điểm gốc (X = «…»; Y = «…»).
naming:
  syntax: <Mã dự án>_<Giai đoạn>-<Đơn vị tạo lập>-<Khu vực/Hệ thống>-<Loại tập tin>-<Bộ môn>-<Số thứ tự>
  example: 'Ví dụ: XXX_FS-PECC2-SW-M3-EL-0502 là mô hình 3D bộ môn Điện của khu vực sân phân phối, do PECC2 lập trong giai đoạn Báo cáo nghiên cứu khả thi.'
  regex: ^[A-Z0-9]{2,6}_[A-Z]{2,3}-[A-Z0-9]{2,6}-[A-Z]{2}-[A-Z0-9]{2}-[A-Z]{2}-\d{4}$
  fields:
  - {name: 'Mã dự án', length: '2–6', required: 'Có', example: 'XXX', note: 'Mã viết tắt của dự án'}
  - {name: 'Giai đoạn', length: '2–3', required: 'Có', example: 'FS', note: 'Theo bảng mã Giai đoạn'}
  - {name: 'Đơn vị tạo lập', length: '2–6', required: 'Có', example: 'PECC2', note: 'Theo bảng mã Đơn vị'}
  - {name: 'Khu vực/Hệ thống', length: '2', required: 'Có', example: 'SW', note: 'Theo bảng mã Khu vực; ZZ nếu áp dụng chung'}
  - {name: 'Loại tập tin', length: '2', required: 'Có', example: 'M3', note: 'Theo bảng mã Loại tập tin'}
  - {name: 'Bộ môn', length: '2', required: 'Có', example: 'EL', note: 'Theo bảng mã Bộ môn; ZZ nếu nhiều bộ môn'}
  - {name: 'Số thứ tự', length: '4', required: 'Có', example: '0502', note: '2 chữ số nhóm khu vực + 2 chữ số thứ tự; 0001 dành cho mô hình tổng hợp và tài liệu quản lý'}
  codes:
  - {table: 'Giai đoạn', code: 'PFS', meaning: 'Báo cáo nghiên cứu tiền khả thi', note: ''}
  - {table: 'Giai đoạn', code: 'FS', meaning: 'Báo cáo nghiên cứu khả thi – Thiết kế cơ sở', note: 'Giai đoạn hiện tại'}
  - {table: 'Giai đoạn', code: 'DD', meaning: 'Thiết kế kỹ thuật', note: ''}
  - {table: 'Giai đoạn', code: 'CD', meaning: 'Thiết kế bản vẽ thi công', note: ''}
  - {table: 'Giai đoạn', code: 'CO', meaning: 'Thi công', note: ''}
  - {table: 'Giai đoạn', code: 'AB', meaning: 'Hoàn công', note: ''}
  - {table: 'Giai đoạn', code: 'OM', meaning: 'Vận hành, bảo trì', note: ''}
  - {table: 'Đơn vị tạo lập', code: 'PECC2', meaning: 'Công ty Cổ phần Tư vấn Xây dựng Điện 2', note: ''}
  - {table: 'Đơn vị tạo lập', code: 'ZZ', meaning: 'Áp dụng chung', note: ''}
  - {table: 'Loại tập tin', code: 'M3', meaning: 'Mô hình 3D', note: 'rvt, ifc, nwc'}
